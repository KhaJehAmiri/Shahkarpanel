<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NexusPanel</title>
  <meta name="description" content="NexusPanel — Professional VPN Control Plane" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%235b8cff'/%3E%3Cstop offset='1' stop-color='%237c5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-weight='800' font-family='system-ui'%3EN%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #07090f;
      --text: #eef2f8;
      --dim: #8b95a8;
      --accent: #5b8cff;
      --accent2: #7c5cff;
      --card: rgba(16, 21, 28, 0.85);
      --border: rgba(255, 255, 255, 0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }
    .nx-bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% -5%, rgba(91, 140, 255, 0.22), transparent),
        radial-gradient(ellipse 55% 45% at 85% 15%, rgba(124, 92, 255, 0.16), transparent),
        radial-gradient(ellipse 40% 30% at 50% 100%, rgba(46, 224, 196, 0.08), transparent),
        var(--bg);
    }
    .nx-grid {
      position: fixed; inset: 0; z-index: 0; opacity: 0.35;
      background-image:
        linear-gradient(rgba(91, 140, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91, 140, 255, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black, transparent);
    }
    .nx-wrap {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 20px 48px;
      text-align: center;
    }
    .nx-mascot {
      width: min(280px, 72vw);
      height: auto;
      margin-bottom: 8px;
      filter: drop-shadow(0 24px 48px rgba(91, 140, 255, 0.25));
      animation: nx-float 4s ease-in-out infinite;
    }
    @keyframes nx-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .nx-mascot .nx-eye { animation: nx-blink 4s step-end infinite; }
    @keyframes nx-blink {
      0%, 92%, 100% { opacity: 1; }
      94%, 96% { opacity: 0.15; }
    }
    .nx-mascot .nx-glow { animation: nx-pulse 2.5s ease-in-out infinite; }
    @keyframes nx-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .nx-brand {
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #fff 20%, #a8c4ff 60%, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .nx-tagline {
      font-size: 1.05rem;
      color: var(--dim);
      max-width: 36ch;
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .nx-cards {
      display: flex; flex-wrap: wrap; gap: 12px;
      justify-content: center; max-width: 520px;
    }
    .nx-card {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      min-width: 200px;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .nx-card:hover {
      border-color: rgba(91, 140, 255, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(91, 140, 255, 0.12);
    }
    .nx-card-ico {
      width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center; font-size: 1.2rem;
      background: linear-gradient(135deg, rgba(91, 140, 255, 0.2), rgba(124, 92, 255, 0.15));
    }
    .nx-card b { display: block; font-size: 0.95rem; text-align: start; }
    .nx-card small { color: var(--dim); font-size: 0.78rem; text-align: start; display: block; }
    .nx-foot {
      margin-top: 40px;
      font-size: 0.78rem;
      color: var(--dim);
    }
    .nx-lang {
      margin-top: 20px;
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    }
    .nx-lang button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--dim);
      border-radius: 999px;
      padding: 5px 12px;
      font: inherit; font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nx-lang button.active, .nx-lang button:hover {
      color: var(--text);
      border-color: rgba(91, 140, 255, 0.5);
      background: rgba(91, 140, 255, 0.1);
    }
    html[dir="rtl"] .nx-card b, html[dir="rtl"] .nx-card small { text-align: end; }
  </style>
</head>
<body>
  <div class="nx-bg" aria-hidden="true"></div>
  <div class="nx-grid" aria-hidden="true"></div>

  <main class="nx-wrap">
    <svg class="nx-mascot" viewBox="0 0 320 360" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="bodyGrad" x1="60" y1="80" x2="260" y2="320" gradientUnits="userSpaceOnUse">
          <stop stop-color="#1a2234"/><stop offset="1" stop-color="#0d1118"/>
        </linearGradient>
        <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#5b8cff"/><stop offset="1" stop-color="#7c5cff"/>
        </linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <!-- Antenna -->
      <line x1="160" y1="48" x2="160" y2="78" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
      <circle class="nx-glow" cx="160" cy="40" r="8" fill="#5b8cff" filter="url(#glow)"/>
      <!-- Head -->
      <rect x="95" y="78" width="130" height="110" rx="28" fill="url(#bodyGrad)" stroke="url(#accentGrad)" stroke-width="2.5"/>
      <!-- Visor -->
      <rect x="110" y="108" width="100" height="44" rx="14" fill="#07090f" stroke="rgba(91,140,255,0.4)" stroke-width="1.5"/>
      <ellipse class="nx-eye" cx="135" cy="130" rx="10" ry="12" fill="#5b8cff" filter="url(#glow)"/>
      <ellipse class="nx-eye" cx="185" cy="130" rx="10" ry="12" fill="#7c5cff" filter="url(#glow)"/>
      <!-- Smile -->
      <path d="M130 158 Q160 172 190 158" stroke="#5b8cff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
      <!-- Body -->
      <path d="M75 200 Q160 185 245 200 L260 290 Q160 310 60 290 Z" fill="url(#bodyGrad)" stroke="url(#accentGrad)" stroke-width="2.5"/>
      <!-- N badge -->
      <circle cx="160" cy="248" r="32" fill="url(#accentGrad)" filter="url(#glow)"/>
      <text x="160" y="258" text-anchor="middle" fill="white" font-size="32" font-weight="800" font-family="system-ui,sans-serif">N</text>
      <!-- Arms -->
      <path d="M75 210 Q40 230 35 270" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M245 210 Q280 230 285 270" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
      <!-- Hands / nodes -->
      <circle cx="35" cy="275" r="12" fill="#1a2234" stroke="#5b8cff" stroke-width="2"/>
      <circle cx="285" cy="275" r="12" fill="#1a2234" stroke="#7c5cff" stroke-width="2"/>
      <circle cx="35" cy="275" r="4" fill="#5b8cff" class="nx-glow"/>
      <circle cx="285" cy="275" r="4" fill="#7c5cff" class="nx-glow"/>
      <!-- Legs -->
      <rect x="120" y="295" width="28" height="50" rx="10" fill="#1a2234" stroke="rgba(91,140,255,0.35)" stroke-width="1.5"/>
      <rect x="172" y="295" width="28" height="50" rx="10" fill="#1a2234" stroke="rgba(91,140,255,0.35)" stroke-width="1.5"/>
      <!-- Shadow -->
      <ellipse cx="160" cy="352" rx="70" ry="8" fill="rgba(91,140,255,0.15)"/>
    </svg>

    <h1 class="nx-brand">NexusPanel</h1>
    <p class="nx-tagline" id="tagline">Professional VPN Control Plane — multi-tenant, white-label, Xray-powered.</p>

    <div class="nx-cards">
      <a class="nx-card" href="/portal/">
        <div class="nx-card-ico">👤</div>
        <div><b id="lbl-portal">User Portal</b><small id="desc-portal">Manage subscription &amp; account</small></div>
      </a>
      <a class="nx-card" href="/subscribe/">
        <div class="nx-card-ico">🔗</div>
        <div><b id="lbl-sub">Subscription</b><small id="desc-sub">Personal VPN profile page</small></div>
      </a>
    </div>

    <div class="nx-lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" class="active">English</button>
      <button type="button" data-lang="fa">فارسی</button>
      <button type="button" data-lang="ru">Русский</button>
      <button type="button" data-lang="zh">中文</button>
    </div>

    <p class="nx-foot" id="foot">Admin dashboard access is provided by your operator.</p>
  </main>

  <script>
    var T = {
      en: {
        tagline: "Professional VPN Control Plane — multi-tenant, white-label, Xray-powered.",
        portal: "User Portal", descPortal: "Manage subscription & account",
        sub: "Subscription", descSub: "Personal VPN profile page",
        foot: "Admin dashboard access is provided by your operator."
      },
      fa: {
        tagline: "کنترل‌پنل حرفه‌ای VPN — چندمستاجری، وایت‌لیبل، مبتنی بر Xray.",
        portal: "پورتال کاربر", descPortal: "مدیریت اشتراک و حساب",
        sub: "صفحه اشتراک", descSub: "پروفایل VPN شخصی",
        foot: "دسترسی به داشبورد ادمین توسط اپراتور شما ارائه می‌شود."
      },
      ru: {
        tagline: "Профессиональная VPN-панель — мультитenant, white-label, Xray.",
        portal: "Портал пользователя", descPortal: "Подписка и аккаунт",
        sub: "Подписка", descSub: "Личный VPN-профиль",
        foot: "Доступ к админ-панели предоставляет оператор."
      },
      zh: {
        tagline: "专业 VPN 控制面板 — 多租户、白标、Xray 驱动。",
        portal: "用户门户", descPortal: "管理订阅与账户",
        sub: "订阅页面", descSub: "个人 VPN 配置",
        foot: "管理面板访问权限由运营商提供。"
      }
    };
    function setLang(code) {
      var d = T[code] || T.en;
      document.documentElement.lang = code;
      document.documentElement.dir = code === "fa" ? "rtl" : "ltr";
      document.getElementById("tagline").textContent = d.tagline;
      document.getElementById("lbl-portal").textContent = d.portal;
      document.getElementById("desc-portal").textContent = d.descPortal;
      document.getElementById("lbl-sub").textContent = d.sub;
      document.getElementById("desc-sub").textContent = d.descSub;
      document.getElementById("foot").textContent = d.foot;
      document.querySelectorAll(".nx-lang button").forEach(function(b) {
        b.classList.toggle("active", b.getAttribute("data-lang") === code);
      });
    }
    var nav = (navigator.language || "en").slice(0, 2);
    setLang(["en","fa","ru","zh"].indexOf(nav) >= 0 ? nav : "en");
    document.querySelectorAll(".nx-lang button").forEach(function(b) {
      b.addEventListener("click", function() { setLang(b.getAttribute("data-lang")); });
    });
  </script>
</body>
</html>
