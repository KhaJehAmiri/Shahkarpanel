# Production-oriented stack: Shahkar + PostgreSQL + Redis.
# Use with: docker compose -f docker-compose.postgres.yml up -d
#
# Set the matching values in /var/lib/shahkar/.env (runtime secrets), e.g.:
#   SQLALCHEMY_DATABASE_URL=postgresql://shahkar:STRONG_SECRET@127.0.0.1:5432/shahkar
#   REDIS_URL=redis://127.0.0.1:6379/0
#
# Build the panel image from this repo (recommended) instead of the upstream image.

name: shahkar
services:
  shahkar:
    build: .
    restart: always
    env_file:
      - .env
      - /var/lib/shahkar/.env
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      # Required for panel-exit WireGuard (tunneled WG terminates on host wg0).
      - /dev/net/tun:/dev/net/tun
    group_add:
      - "${DOCKER_GID:-988}"
    volumes:
      - /var/lib/shahkar:/var/lib/shahkar
      - .:/code
      # SigmaGuard Wire presets (sigma_preset.py) — required when feature flag
      # sigmaguard_wire is on; same mount as docker-compose.yml.
      - /opt/sigmaguard/wire:/opt/sigmaguard/wire:ro
      # Host LE certs — read for vhost render; host-side certbot (chroot
      # reconcile) writes new certs. Keep webroot writable for HTTP-01.
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/letsencrypt:/var/www/letsencrypt
      # docker/compose/buildx CLI ships in the image itself (see Dockerfile);
      # only the socket needs to come from the host (AUDIT_FINDINGS.md C5).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${UVICORN_PORT:-8000}/api/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    restart: always
    network_mode: host
    env_file:
      - .env
      - /var/lib/shahkar/.env
    volumes:
      - /var/lib/shahkar/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-shahkar} -d $${POSTGRES_DB:-shahkar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    network_mode: host
    env_file:
      - .env
      - /var/lib/shahkar/.env
    command:
      - sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        else
          exec redis-server --appendonly yes
        fi
    volumes:
      - /var/lib/shahkar/redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi
      interval: 5s
      timeout: 5s
      retries: 10
