global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: shahkar
    metrics_path: /api/metrics
    scheme: http
    # Provide the METRICS_TOKEN you configured in Shahkar's .env.
    authorization:
      type: Bearer
      credentials: "REPLACE_WITH_METRICS_TOKEN"
    static_configs:
      - targets: ["host.docker.internal:8000"]
