<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NexusPanel</title>
  <meta name="description" content="NexusPanel — Professional VPN Control Plane" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2306110e'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%232ee0c4' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%232ee0c4'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #06110e;
      --ink-2: #0b1a16;
      --fog: #d7efe8;
      --mute: #7a9a91;
      --accent: #2ee0c4;
      --accent-dim: rgba(46, 224, 196, 0.14);
      --line: rgba(215, 239, 232, 0.1);
      --font-display: "Syne", "Vazirmatn", system-ui, sans-serif;
      --font-body: "Manrope", "Vazirmatn", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--ink);
      color: var(--fog);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .nx-stage {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      isolation: isolate;
    }

    /* Full-bleed atmospheric plane */
    .nx-plane {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 70% at 70% 20%, rgba(46, 224, 196, 0.16), transparent 55%),
        radial-gradient(ellipse 60% 50% at 10% 80%, rgba(46, 224, 196, 0.07), transparent 50%),
        linear-gradient(165deg, #06110e 0%, #0a1814 45%, #07120f 100%);
    }

    .nx-plane::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(46, 224, 196, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(46, 224, 196, 0.035) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 75% 65% at 60% 35%, black, transparent);
      animation: nx-drift 28s linear infinite;
      opacity: 0.7;
    }

    @keyframes nx-drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-64px, -64px, 0); }
    }

    .nx-orbits {
      position: absolute;
      width: min(92vw, 720px);
      aspect-ratio: 1;
      right: -8%;
      top: 50%;
      transform: translateY(-52%);
      pointer-events: none;
    }

    html[dir="rtl"] .nx-orbits {
      right: auto;
      left: -8%;
    }

    .nx-orbits svg {
      width: 100%;
      height: 100%;
      animation: nx-spin 48s linear infinite;
    }

    .nx-orbits .nx-ring-slow {
      animation: nx-spin-rev 72s linear infinite;
      transform-origin: 50% 50%;
    }

    @keyframes nx-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes nx-spin-rev {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    .nx-top {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: flex-end;
      padding: 22px 28px 0;
    }

    .nx-lang {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(6, 17, 14, 0.55);
      backdrop-filter: blur(10px);
    }

    .nx-lang button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--mute);
      font: 500 0.72rem/1 var(--font-body);
      letter-spacing: 0.02em;
      padding: 7px 11px;
      border-radius: 7px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }

    .nx-lang button:hover { color: var(--fog); }
    .nx-lang button.active {
      color: var(--ink);
      background: var(--accent);
      font-weight: 600;
    }

    .nx-hero {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px clamp(24px, 6vw, 80px) 56px;
      max-width: 780px;
      animation: nx-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    html[dir="rtl"] .nx-hero { margin-inline-start: auto; }

    @keyframes nx-rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nx-mark {
      width: 42px;
      height: 42px;
      margin-bottom: 28px;
      color: var(--accent);
      animation: nx-pulse 3.6s ease-in-out infinite;
    }

    @keyframes nx-pulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .nx-brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(3rem, 9vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: -0.045em;
      color: var(--fog);
      margin-bottom: 22px;
    }

    .nx-brand span {
      color: var(--accent);
    }

    .nx-headline {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.15rem, 2.4vw, 1.45rem);
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: var(--fog);
      max-width: 22ch;
      margin-bottom: 14px;
    }

    .nx-support {
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.6;
      color: var(--mute);
      max-width: 36ch;
      margin-bottom: 36px;
    }

    .nx-cta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 22px;
    }

    .nx-cta-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 0 0 0 rgba(46, 224, 196, 0);
    }

    .nx-cta-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 40px rgba(46, 224, 196, 0.28);
      background: #5aebd0;
    }

    .nx-cta-primary svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    html[dir="rtl"] .nx-cta-primary svg { transform: scaleX(-1); }
    .nx-cta-primary:hover svg { transform: translateX(3px); }
    html[dir="rtl"] .nx-cta-primary:hover svg { transform: scaleX(-1) translateX(3px); }

    .nx-cta-ghost {
      color: var(--fog);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }

    .nx-cta-ghost:hover {
      color: var(--accent);
      border-color: rgba(46, 224, 196, 0.45);
    }

    .nx-foot {
      position: relative;
      z-index: 2;
      padding: 0 28px 28px;
      font-size: 0.75rem;
      color: var(--mute);
      opacity: 0.75;
      animation: nx-rise 1.1s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @media (max-width: 720px) {
      .nx-orbits {
        opacity: 0.35;
        right: -35%;
        width: 120vw;
        top: 18%;
        transform: none;
      }
      html[dir="rtl"] .nx-orbits { left: -35%; right: auto; }
      .nx-top { padding: 18px 18px 0; }
      .nx-hero { padding: 36px 22px 48px; }
      .nx-foot { padding: 0 22px 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nx-plane::after,
      .nx-orbits svg,
      .nx-orbits .nx-ring-slow,
      .nx-mark,
      .nx-hero,
      .nx-foot { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="nx-stage">
    <div class="nx-plane" aria-hidden="true">
      <div class="nx-orbits">
        <svg viewBox="0 0 640 640" fill="none">
          <circle cx="320" cy="320" r="210" stroke="rgba(46,224,196,0.18)" stroke-width="1.2" />
          <circle class="nx-ring-slow" cx="320" cy="320" r="278" stroke="rgba(46,224,196,0.1)" stroke-width="1" stroke-dasharray="6 14" />
          <circle cx="320" cy="320" r="146" stroke="rgba(46,224,196,0.22)" stroke-width="1.4" />
          <circle cx="320" cy="110" r="5" fill="#2ee0c4" opacity="0.9" />
          <circle cx="510" cy="360" r="4" fill="#2ee0c4" opacity="0.65" />
          <circle cx="180" cy="470" r="3.5" fill="#2ee0c4" opacity="0.5" />
          <path d="M320 110 L510 360 L180 470 Z" stroke="rgba(46,224,196,0.2)" stroke-width="1" />
          <circle cx="320" cy="320" r="10" fill="rgba(46,224,196,0.15)" stroke="#2ee0c4" stroke-width="1.5" />
        </svg>
      </div>
    </div>

    <header class="nx-top">
      <div class="nx-lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="active">EN</button>
        <button type="button" data-lang="fa">FA</button>
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
    </header>

    <main class="nx-hero">
      <svg class="nx-mark" viewBox="0 0 42 42" fill="none" aria-hidden="true">
        <circle cx="21" cy="21" r="18" stroke="currentColor" stroke-width="1.5" opacity="0.35" />
        <circle cx="21" cy="21" r="9" stroke="currentColor" stroke-width="2" />
        <circle cx="21" cy="21" r="3" fill="currentColor" />
      </svg>

      <h1 class="nx-brand">Nexus<span>Panel</span></h1>
      <p class="nx-headline" id="headline">The control plane for modern VPN fleets.</p>
      <p class="nx-support" id="tagline">Multi-tenant. White-label. Xray at the core.</p>

      <div class="nx-cta">
        <a class="nx-cta-primary" href="/portal/">
          <span id="lbl-portal">Open portal</span>
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a class="nx-cta-ghost" href="/subscribe/" id="lbl-sub">Subscription</a>
      </div>
    </main>

    <p class="nx-foot" id="foot">Admin dashboard access is provided by your operator.</p>
  </div>

  <script>
    var T = {
      en: {
        headline: "The control plane for modern VPN fleets.",
        tagline: "Multi-tenant. White-label. Xray at the core.",
        portal: "Open portal",
        sub: "Subscription",
        foot: "Admin dashboard access is provided by your operator."
      },
      fa: {
        headline: "مرکز کنترل ناوگان مدرن VPN.",
        tagline: "چندمستاجری. وایت‌لیبل. مبتنی بر Xray.",
        portal: "ورود به پورتال",
        sub: "صفحه اشتراک",
        foot: "دسترسی به داشبورد ادمین توسط اپراتور شما ارائه می‌شود."
      },
      ru: {
        headline: "Панель управления современными VPN-флотами.",
        tagline: "Мультитенант. White-label. На базе Xray.",
        portal: "Открыть портал",
        sub: "Подписка",
        foot: "Доступ к админ-панели предоставляет оператор."
      },
      zh: {
        headline: "现代 VPN 集群的控制平面。",
        tagline: "多租户。白标。以 Xray 为核心。",
        portal: "打开门户",
        sub: "订阅页面",
        foot: "管理面板访问权限由运营商提供。"
      }
    };

    function setLang(code) {
      var d = T[code] || T.en;
      document.documentElement.lang = code;
      document.documentElement.dir = code === "fa" ? "rtl" : "ltr";
      document.getElementById("headline").textContent = d.headline;
      document.getElementById("tagline").textContent = d.tagline;
      document.getElementById("lbl-portal").textContent = d.portal;
      document.getElementById("lbl-sub").textContent = d.sub;
      document.getElementById("foot").textContent = d.foot;
      document.querySelectorAll(".nx-lang button").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-lang") === code);
      });
    }

    var stored = null;
    try { stored = localStorage.getItem("nx_lang"); } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2);
    var initial = ["en", "fa", "ru", "zh"].indexOf(stored) >= 0
      ? stored
      : (["en", "fa", "ru", "zh"].indexOf(nav) >= 0 ? nav : "en");
    setLang(initial);

    document.querySelectorAll(".nx-lang button").forEach(function (b) {
      b.addEventListener("click", function () {
        var code = b.getAttribute("data-lang");
        setLang(code);
        try { localStorage.setItem("nx_lang", code); } catch (e) {}
      });
    });
  </script>
</body>
</html>
