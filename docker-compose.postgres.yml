# Production-oriented stack: NexusPanel + PostgreSQL + Redis.
# Use with: docker compose -f docker-compose.postgres.yml up -d
#
# Set the matching values in /var/lib/nexuspanel/.env (runtime secrets), e.g.:
#   SQLALCHEMY_DATABASE_URL=postgresql://nexuspanel:STRONG_SECRET@127.0.0.1:5432/nexuspanel
#   REDIS_URL=redis://127.0.0.1:6379/0
#
# Build the panel image from this repo (recommended) instead of the upstream image.

name: nexuspanel

services:
  nexuspanel:
    build: .
    restart: always
    env_file:
      - .env
      - /var/lib/nexuspanel/.env
    network_mode: host
    cap_add:
      - NET_ADMIN
    group_add:
      - "${DOCKER_GID:-988}"
    volumes:
      - /var/lib/nexuspanel:/var/lib/nexuspanel
      - .:/code
      # SigmaGuard Wire presets (sigma_preset.py) — required when feature flag
      # sigmaguard_wire is on; same mount as docker-compose.yml.
      - /opt/sigmaguard/wire:/opt/sigmaguard/wire:ro
      # docker/compose/buildx CLI ships in the image itself (see Dockerfile);
      # only the socket needs to come from the host (AUDIT_FINDINGS.md C5).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: always
    network_mode: host
    env_file:
      - .env
      - /var/lib/nexuspanel/.env
    volumes:
      - /var/lib/nexuspanel/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nexuspanel} -d $${POSTGRES_DB:-nexuspanel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    network_mode: host
    env_file:
      - .env
      - /var/lib/nexuspanel/.env
    command:
      - sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        else
          exec redis-server --appendonly yes
        fi
    volumes:
      - /var/lib/nexuspanel/redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi
      interval: 5s
      timeout: 5s
      retries: 10
