name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Create xray stub
        run: |
          sudo mkdir -p /usr/local/bin
          printf '#!/usr/bin/env bash\ncase "$1" in\n  version) echo "Xray 1.8.4 (stub)";;\n  x25519) printf "Private key: k\\nPublic key: p\\n";;\n  *) echo stub;;\nesac\n' | sudo tee /usr/local/bin/xray > /dev/null
          sudo chmod +x /usr/local/bin/xray

      - name: Lint (new modules)
        run: ruff check app/events app/backup.py app/bootstrap_limit.py app/feature_flags.py app/utils/logging.py tests

      - name: Run tests
        run: pytest -q

  migrations-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexuspanel
          POSTGRES_PASSWORD: nexuspanel
          POSTGRES_DB: nexuspanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexuspanel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQLALCHEMY_DATABASE_URL: postgresql://nexuspanel:nexuspanel@127.0.0.1:5432/nexuspanel
      XRAY_EXECUTABLE_PATH: /usr/local/bin/xray
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create xray stub
        run: |
          sudo mkdir -p /usr/local/bin
          printf '#!/usr/bin/env bash\ncase "$1" in\n  version) echo "Xray 1.8.4 (stub)";;\n  x25519) printf "Private key: k\\nPublic key: p\\n";;\n  *) echo stub;;\nesac\n' | sudo tee /usr/local/bin/xray > /dev/null
          sudo chmod +x /usr/local/bin/xray

      - name: Apply migrations on PostgreSQL (validates CITEXT compatibility)
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
