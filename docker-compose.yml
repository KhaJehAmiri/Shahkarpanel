name: shahkar
services:
  shahkar:
    build: .
    restart: always
    # Panel holds many RPyC/node sockets + temp files; default soft 1024
    # exhausts (Errno 24) and marks nodes error. Match host-capable ceiling.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    stop_grace_period: 5s
    env_file:
      - .env
      - /var/lib/shahkar/.env
    network_mode: host
    pid: host
    cap_add:
      - NET_ADMIN
    devices:
      # Required for panel-exit WireGuard (tunneled WG terminates on host wg0).
      - /dev/net/tun:/dev/net/tun
    group_add:
      - "${DOCKER_GID:-988}"
    volumes:
      - /var/lib/shahkar:/var/lib/shahkar
      # Directory-only nginx mounts. Never bind individual files (nginx.conf,
      # mime.types, proxy_params, /run/nginx.pid, /usr/sbin/nginx): if the host
      # path is missing, Docker creates a *directory* stub and permanently
      # breaks host nginx / reseller subscription domains.
      - /etc/nginx/sites-available:/etc/nginx/sites-available
      - /etc/nginx/sites-enabled:/etc/nginx/sites-enabled
      - /etc/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/letsencrypt:/var/www/letsencrypt
      - /var/lib/nginx:/var/lib/nginx
      - /var/log/nginx:/var/log/nginx
      - .:/code
      - /opt/sigmaguard/wire:/opt/sigmaguard/wire:ro
      # Only the socket is host-provided; the docker/compose/buildx CLI now
      # ships in the image itself (see Dockerfile) instead of being bind-
      # mounted from the host's /usr/bin and cli-plugins — one less place a
      # host-side binary swap could affect the container (AUDIT_FINDINGS.md C5).
      # The socket itself is still required for in-dashboard panel updates
      # (app/system/update_jobs.py) and Postgres backup/restore (app/backup.py).
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SHAHKAR_ROLE: api
      # Two API workers ≈ 2.8Gi on a 27k-user panel — too much for an 8Gi host
      # that also runs the Xray worker. Override with UVICORN_WORKERS=2 on bigger boxes.
      UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"
      SQLALCHEMY_POOL_SIZE: "8"
      SQLALCHEMY_MAX_OVERFLOW: "8"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${UVICORN_PORT:-8000}/api/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  shahkar-worker:
    build: .
    restart: always
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    stop_grace_period: 15s
    env_file:
      - .env
      - /var/lib/shahkar/.env
    environment:
      SHAHKAR_ROLE: worker
      SQLALCHEMY_POOL_SIZE: "16"
      SQLALCHEMY_MAX_OVERFLOW: "16"
    command: ["worker"]
    network_mode: host
    pid: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    group_add:
      - "${DOCKER_GID:-988}"
    volumes:
      - /var/lib/shahkar:/var/lib/shahkar
      - /etc/nginx/sites-available:/etc/nginx/sites-available
      - /etc/nginx/sites-enabled:/etc/nginx/sites-enabled
      - /etc/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/letsencrypt:/var/www/letsencrypt
      - /var/lib/nginx:/var/lib/nginx
      - /var/log/nginx:/var/log/nginx
      - .:/code
      - /opt/sigmaguard/wire:/opt/sigmaguard/wire:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      shahkar:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 /code/scripts/worker_healthcheck.py
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s

