# Production-oriented stack: NexusPanel + PostgreSQL + Redis.
# Use with: docker compose -f docker-compose.postgres.yml up -d
#
# Set the matching values in your .env file, e.g.:
#   SQLALCHEMY_DATABASE_URL=postgresql://nexuspanel:change-me@127.0.0.1:5432/nexuspanel
#   REDIS_URL=redis://127.0.0.1:6379/0
#
# Build the panel image from this repo (recommended) instead of the upstream image.

services:
  nexuspanel:
    build: .
    restart: always
    env_file: .env
    network_mode: host
    group_add:
      - "${DOCKER_GID:-988}"
    volumes:
      - /var/lib/nexuspanel:/var/lib/nexuspanel
      - .:/code
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexuspanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-nexuspanel}
    volumes:
      - /var/lib/nexuspanel/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexuspanel} -d ${POSTGRES_DB:-nexuspanel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    network_mode: host
    command:
      - sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        else
          exec redis-server --appendonly yes
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - /var/lib/nexuspanel/redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi
      interval: 5s
      timeout: 5s
      retries: 10
